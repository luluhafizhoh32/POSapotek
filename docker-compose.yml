services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pos_app:ganti_di_env@postgres:5432/pos_apotek
      DATABASE_URL_MIGRATOR: postgres://pos_migrator:ganti_di_env@postgres:5432/pos_apotek
    ports:
      - "3000:3000"
    volumes:
      - lampiran_data:/app/data/lampiran
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pos_app:ganti_di_env@postgres:5432/pos_apotek
      DATABASE_URL_MIGRATOR: postgres://pos_migrator:ganti_di_env@postgres:5432/pos_apotek
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  lampiran_data:
